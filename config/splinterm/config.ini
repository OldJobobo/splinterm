# Splinterm Phase 8 supported configuration subset.
# Install as ${XDG_CONFIG_HOME:-~/.config}/splinterm/config.ini.
[main]
# Uses Omarchy's effective Fontconfig monospace family by default.
# font=monospace:style=Regular
font-pixelsize=14
font-sizing-policy=output-scale
padding-left=12
padding-right=12
padding-top=12
padding-bottom=12
initial-columns=80
initial-rows=24
login-shell=yes
# shell=/bin/bash
# title=Splinterm
resize-delay-ms=100
# Omarchy is the default theme source. Set this only to opt out with an
# explicit Splinterm JSON palette:
# theme=~/.config/splinterm/theme.json

# Optional explicit overrides (normally owned by the active Omarchy theme):
# [colors]
# alpha=0.9
# blur=yes

[scrollback]
lines=1000

[multiplexer]
# Ordinary unnamed local graphical terminals remain durable by default.
persistent-by-default=yes
# Creating or explicitly naming a Dojo promotes its transient Lair.
persist-on-tab-organization=yes
# line: shared dividers; frame: one titled frame per Splint; none: no chrome.
divider-style=line
frame-title=splint

[cursor]
style=block
blink=yes

[key-bindings]
# The compatibility-preserving built-in profile remains the default.
profile=splinterm
# Optional strict TOML overlay, resolved relative to this config file.
# file=keybindings.toml
# Bounds the built-in omarchy-tmux profile's Ctrl+Space/Ctrl+B prefix state.
prefix-timeout-ms=1000

[presets]
# Optional strict user overlay for packaged Omarchy presets, resolved relative
# to this config file.
# file=presets.toml
# Explicitly enables packaged c/cx/cy direct argv; no shell evaluation.
allow-unrestricted-commands=no

# Color roles come from the active Omarchy theme, not this file.
