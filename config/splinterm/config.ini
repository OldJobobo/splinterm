# Splinterm Phase 8 supported configuration subset.
# Install as ${XDG_CONFIG_HOME:-~/.config}/splinterm/config.ini.
[main]
font=JetBrains Mono Nerd Font:style=Regular
font-pixelsize=14
font-sizing-policy=output-scale
padding-left=12
padding-right=12
padding-top=12
padding-bottom=12
initial-columns=80
initial-rows=24
login-shell=yes
# shell=/bin/bash
# title=Splinterm
resize-delay-ms=0
theme=~/.config/splinterm/theme.json

[colors]
# Foot-compatible default-background translucency (0.0–1.0).
alpha=1.0

[scrollback]
lines=1000

[multiplexer]
# line: shared dividers; frame: one titled frame per Splint; none: no chrome.
divider-style=line
frame-title=splint

[cursor]
style=block
blink=yes

# Built-in bindings are documented in docs/configuration.md and are not yet
# remappable. Color roles belong in generated theme.json, not this file.
