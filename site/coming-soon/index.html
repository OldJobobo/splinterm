<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Splinterm — coming soon." />
    <meta name="theme-color" content="#201e1f" />
    <title>Splinterm — Coming Soon</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #201e1f;
        --foreground: #f2e6d8;
        --muted: #94887a;
        --accent: #d8a06f;
      }

      * { box-sizing: border-box; }

      html, body { min-width: 320px; min-height: 100%; }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--background);
        color: var(--foreground);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(90vw, 760px);
        display: grid;
        justify-items: center;
        text-align: center;
        padding: 48px 20px;
      }

      img {
        width: clamp(210px, 38vw, 390px);
        height: auto;
        display: block;
      }

      h1 {
        margin: clamp(18px, 3vh, 32px) 0 0;
        font-size: clamp(56px, 10vw, 118px);
        font-weight: 650;
        line-height: 0.9;
        letter-spacing: -0.07em;
      }

      p {
        margin: clamp(28px, 5vh, 52px) 0 0;
        color: var(--muted);
        font-size: clamp(12px, 1.4vw, 15px);
        font-weight: 650;
        letter-spacing: 0.26em;
        text-transform: uppercase;
      }

      a {
        margin-top: 22px;
        display: inline-flex;
        align-items: center;
        gap: 0.7em;
        padding: 12px 16px 11px;
        border: 1px solid color-mix(in srgb, var(--accent) 48%, transparent);
        color: var(--foreground);
        font-size: 14px;
        font-weight: 650;
        letter-spacing: 0.04em;
        text-decoration: none;
        transition: border-color 160ms ease, color 160ms ease, transform 160ms ease;
      }

      a span { color: var(--accent); }

      a:hover, a:focus-visible {
        border-color: var(--accent);
        color: var(--accent);
        transform: translateY(-2px);
      }

      a:focus-visible { outline: 2px solid var(--foreground); outline-offset: 4px; }

      @media (prefers-reduced-motion: reduce) {
        a { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png?v=2" alt="Splinterm" width="768" height="768" />
      <h1>splinterm</h1>
      <p>Public alpha · full site coming soon</p>
      <a href="https://preview.splinterm.com/docs/">Read the documentation <span aria-hidden="true">↗</span></a>
    </main>
  </body>
</html>
