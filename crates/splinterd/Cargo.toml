[package]
name = "splinterd"
description = "Persistent terminal topology daemon for Splinterm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
integration-test = []

[dependencies]
anyhow.workspace = true
libc.workspace = true
nix = { workspace = true, features = ["fs", "process", "uio"] }
serde.workspace = true
serde_json.workspace = true
seccompiler.workspace = true
sha2.workspace = true
splinterm-core = { path = "../splinterm-core" }
splinterm-filemap = { path = "../splinterm-filemap" }
splinterm-inherited-fd = { path = "../splinterm-inherited-fd" }
splinterm-policy = { path = "../splinterm-policy" }
splinterm-protocol = { path = "../splinterm-protocol" }
splinterm-pty = { path = "../splinterm-pty" }
splinterm-terminal = { path = "../splinterm-terminal" }
rustix = { workspace = true, features = ["system"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zbus.workspace = true

[dev-dependencies]
proc-macro2 = "1.0"
splinterm-automation-client = { path = "../splinterm-automation-client" }
splinterm-inherited-fd = { path = "../splinterm-inherited-fd", features = ["test-support"] }
splinterm-mcp = { path = "../splinterm-mcp", features = ["integration-test"] }
syn = { version = "2.0", features = ["full", "visit"] }
tokio = { workspace = true, features = ["test-util"] }
toml.workspace = true

# A workspace `unsafe_code = "forbid"` cannot be overridden locally. The daemon
# binary has exactly one audited post-exec invocation of the inherited-FD leaf
# crate, so this package copies the workspace policy with `deny` instead.
# tests/unsafe_boundary_audit.rs pins this exact table and that one exception.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
