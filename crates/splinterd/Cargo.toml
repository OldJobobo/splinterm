[package]
name = "splinterd"
description = "Persistent terminal topology daemon for Splinterm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
nix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
splinterm-core = { path = "../splinterm-core" }
splinterm-protocol = { path = "../splinterm-protocol" }
splinterm-pty = { path = "../splinterm-pty" }
splinterm-terminal = { path = "../splinterm-terminal" }
rustix.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zbus.workspace = true

[dev-dependencies]
splinterm-automation-client = { path = "../splinterm-automation-client" }
splinterm-mcp = { path = "../splinterm-mcp", features = ["integration-test"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
