[package]
name = "splinterm-image-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
base64 = "=0.22.1"
flate2 = { version = "=1.1.5", default-features = false, features = ["rust_backend"] }
png = "=0.18.0"
rustix = { version = "=1.1.4", features = ["fs", "net", "rand"] }
sha2 = "=0.10.9"
thiserror = "=2.0.19"

[dev-dependencies]
serde_json = "1.0"

[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
