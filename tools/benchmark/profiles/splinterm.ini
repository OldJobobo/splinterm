# Controlled Splinterbench profile. Graphical placement fixes the outer pixel size.
[main]
font=JetBrains Mono Nerd Font:style=Regular
font-pixelsize=14
font-sizing-policy=output-scale
padding-left=12
padding-right=12
padding-top=12
padding-bottom=12
initial-columns=80
initial-rows=24
login-shell=no
resize-delay-ms=0

[colors]
alpha=1.0

[scrollback]
lines=1000

[multiplexer]
divider-style=none
frame-title=none

[cursor]
style=block
blink=no
