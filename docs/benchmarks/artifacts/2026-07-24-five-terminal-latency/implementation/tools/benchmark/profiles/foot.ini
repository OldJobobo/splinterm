# Controlled Splinterbench profile. Graphical placement fixes the outer pixel size.
[main]
font=JetBrains Mono Nerd Font:style=Regular:pixelsize=14
pad=12x12
initial-window-size-chars=80x24
dpi-aware=no
term=xterm-256color

[colors-dark]
alpha=1.0

[scrollback]
lines=1000

[cursor]
style=block
blink=no
