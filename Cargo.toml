[workspace]
members = [
    "crates/splinterm",
    "crates/splinterm-automation-client",
    "crates/splinterd",
    "crates/splinterm-relay",
    "crates/splinterm-graphical-relay",
    "crates/splinterm-core",
    "crates/splinterm-protocol",
    "crates/splinterm-pty",
    "crates/splinterm-terminal",
    "crates/splinterm-freetype",
    "crates/splinterm-pixman",
    "crates/splinterm-filemap",
    "crates/splinterm-mcp",
]
resolver = "3"

[workspace.package]
version = "0.1.0-beta1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/oldjobobo/splinterm"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
flate2 = "1.1"
clap = { version = "4.5", features = ["derive"] }
fontdb = "0.23.0"
freetype-rs = "0.38.0"
pixman-sys = "0.1.0"
png = "0.18"
rmcp = { version = "=2.2.0", default-features = false, features = ["server", "transport-io"] }
seccompiler = { version = "0.5.0", default-features = false }
libc = "0.2"
memmap2 = "0.9.11"
nix = { version = "0.30.1", default-features = false, features = ["poll", "socket"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
smithay-client-toolkit = "0.20.0"
swash = "0.2.10"
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process", "pty", "rand", "termios", "time"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-width = "0.2"
uuid = { version = "1.18", features = ["serde", "v4"] }
zbus = "5.12.0"
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.12", features = ["client", "staging"] }

# Integration authentication hashes the exact client executable on every local
# connection. Debug sections make test binaries unnecessarily large and dominate
# daemon end-to-end runtime; panic and test names remain available without them.
[profile.test]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
