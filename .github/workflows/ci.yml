name: CI

on:
  push:
    branches: [main, "maint/0.1"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  preflight:
    name: Fast release preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate deterministic release state
        run: python tools/release/release-doctor.py
      - name: Validate executable workflow syntax with pinned actionlint
        # actionlint v1.7.7 multi-platform image index.
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
        with:
          args: -color

  static:
    name: Rust format, clippy, and shell static checks
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rmcp 2.2.0's macros require Rust 1.88; keep CI on the workspace MSRV.
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libpixman-1-dev libxkbcommon-dev pkg-config
      - name: Fetch the locked dependency graph
        run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: shellcheck install.sh tools/package/build-local-package.sh tools/package/upgrade-local-package.sh tools/testbed/omarchy-vm.sh
      - run: cargo clippy --frozen --workspace --all-targets -- -D warnings

  workspace-tests:
    name: Workspace unit and non-daemon/non-MCP integration tests
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk libfontconfig1-dev libfreetype6-dev libpixman-1-dev libxkbcommon-dev pkg-config
      - name: Fetch the locked dependency graph
        run: cargo fetch --locked
      - name: Install pinned renderer test fonts
        run: |
          font_dir="$HOME/.local/share/fonts/splinterm-ci"
          base='https://raw.githubusercontent.com/ryanoasis/nerd-fonts/fa7b859994228a9c8759f99c55a8d31ee92a1b5e/patched-fonts/JetBrainsMono/Ligatures'
          mkdir -p "$font_dir"
          for style in Regular Bold Italic BoldItalic; do
            curl --fail --location --silent --show-error \
              "$base/$style/JetBrainsMonoNerdFont-$style.ttf" \
              --output "$font_dir/JetBrainsMonoNerdFont-$style.ttf"
          done
          (
            cd "$font_dir"
            sha256sum --check <<'CHECKSUMS'
          0ec29a68b539ece7078fc714cebff0c0accb2f4948f8f7963d9f5e86633b12d9  JetBrainsMonoNerdFont-Regular.ttf
          e82e27a7f37c9a0a13cc4e417503a149c6a0280586930772d2ebed803159c864  JetBrainsMonoNerdFont-Bold.ttf
          981133a258ef4c62769a7a7214a4b455ac1c63923784a70f50c48977b67f7025  JetBrainsMonoNerdFont-Italic.ttf
          961222be7bce59f310b41a3e158368d5ea22a47a0ac31defd57caac9b9e82cb0  JetBrainsMonoNerdFont-BoldItalic.ttf
          CHECKSUMS
          )
          fc-cache --force
          fc-match 'JetBrains Mono Nerd Font:style=Bold' | grep -F 'JetBrainsMonoNerdFont-Bold.ttf'
          fc-match 'Noto Sans CJK JP:style=Regular' | grep -F 'NotoSansCJK-Regular.ttc'
      - name: Build the PTY child helper required by daemon live tests
        run: cargo build --frozen -p splinterm-pty --bin splinterm-pty-child
      - name: Run workspace unit, binary, example, and documentation tests
        run: |
          set -o pipefail
          {
            cargo test --frozen --workspace --lib --bins --examples -- --test-threads=1
            cargo test --frozen --workspace --doc -- --test-threads=1
          } 2>&1 | tee workspace-tests.log
      - name: Run every remaining Rust integration target exactly once
        run: |
          set -o pipefail
          {
            cargo test --frozen -p splinterd \
              --test handoff_descriptors_exec -- --test-threads=1
            cargo test --frozen --workspace --features splinterd/integration-test \
              --test sealed_preflight_binary -- --test-threads=1
            cargo test --frozen -p splinterm-pty \
              --test linux_pty --test pty_adoption_exec -- --test-threads=1
            cargo test --frozen -p splinterm-relay --test stdio -- --test-threads=1
            cargo test --frozen -p splinterm-terminal \
              --test images --test iterm --test kitty --test memory_layout \
              --test oracle_fixtures --test snapshot -- --test-threads=1
            cargo test --frozen -p splinterm \
              --test automation_cli --test diagnostics_subprocess --test keymap_cli \
              --test policy_cli --test preset_schema --test remote_cli \
              --test remote_session --test shell_cli -- --test-threads=1
          } 2>&1 | tee -a workspace-tests.log
      - name: Upload focused workspace failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: workspace-test-failure-${{ github.run_id }}
          path: workspace-tests.log
          if-no-files-found: error
          retention-days: 14

  daemon-tests:
    name: Daemon end-to-end tests
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libpixman-1-dev libxkbcommon-dev pkg-config
      - name: Fetch the locked dependency graph
        run: cargo fetch --locked
      - name: Build the PTY child helper required by daemon integration tests
        run: cargo build --frozen -p splinterm-pty --bin splinterm-pty-child
      - name: Run daemon integration target without retry
        run: |
          set -o pipefail
          cargo test --frozen -p splinterd --test end_to_end -- --test-threads=1 \
            2>&1 | tee daemon-end-to-end.log
      - name: Upload focused daemon failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: daemon-end-to-end-failure-${{ github.run_id }}
          path: daemon-end-to-end.log
          if-no-files-found: error
          retention-days: 14

  mcp-tests:
    name: MCP protocol tests
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libpixman-1-dev libxkbcommon-dev pkg-config
      - name: Fetch the locked dependency graph
        run: cargo fetch --locked
      - name: Run MCP integration targets without retry
        run: |
          set -o pipefail
          cargo test --frozen -p splinterm-mcp \
            --test schema_inventory --test stdio_protocol -- --test-threads=1 \
            2>&1 | tee mcp-protocol.log
      - name: Upload focused MCP failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: mcp-protocol-failure-${{ github.run_id }}
          path: mcp-protocol.log
          if-no-files-found: error
          retention-days: 14

  package-automation:
    name: Package and release automation tests
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run package/release Python boundary
        run: |
          set -o pipefail
          python -m unittest \
            tools/automation/test_dojo_picker.py \
            tools/testbed/test_guest_window.py \
            tools/testbed/test_omarchy_vm.py \
            tools/testbed/test_qmp_input.py \
            tools/package/test_release_manifest.py \
            tools/package/test_installer_safety.py \
            tools/package/test_omarchy_screensaver_integration.py \
            tools/package/test_systemd_unit.py \
            tools/package/test_validate_mcp_package.py \
            tools/package/test_workload_units.py \
            tools/release/test_ci_attestation.py \
            tools/release/test_prepare_candidate.py \
            tools/release/test_promote_release.py \
            tools/release/test_release_doctor.py \
            tools/release/test_ci_workflow.py \
            tools/release/test_release_candidate_workflow.py \
            tools/release/test_promote_release_workflow.py \
            tools/release/test_recover_release_workflow.py \
            tools/release/test_distribute_aur.py \
            tools/release/test_distribute_aur_workflow.py \
            2>&1 | tee package-release-tests.log
      - name: Upload focused package/release failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: package-release-failure-${{ github.run_id }}
          path: package-release-tests.log
          if-no-files-found: error
          retention-days: 14

  renderer-contracts:
    name: Splinterm-owned renderer and contract fixtures
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Python fixture dependencies
        run: python -m pip install 'jsonschema>=4.18' pillow pytest referencing
      - name: Validate source-owned contracts and benchmark reporting
        run: |
          set -o pipefail
          {
            python tools/benchmark/generate-semantic-fixture-vectors.py --check
            python tools/foot-oracle/validate-fixtures.py
            python tools/automation/validate-contract-fixtures.py
            python -m pytest -q tools/benchmark/test_benchmark.py
            python -m pytest -q tools/foot-oracle/test_run_final_buffer_comparison.py
          } 2>&1 | tee renderer-contracts.log
      - name: Upload focused renderer-contract failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: renderer-contract-failure-${{ github.run_id }}
          path: renderer-contracts.log
          if-no-files-found: error
          retention-days: 14

  check:
    name: check
    if: ${{ always() }}
    needs:
      - preflight
      - static
      - workspace-tests
      - daemon-tests
      - mcp-tests
      - package-automation
      - renderer-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed unless every mandatory boundary succeeded
        if: ${{ needs.preflight.result != 'success' || needs.static.result != 'success' || needs.workspace-tests.result != 'success' || needs.daemon-tests.result != 'success' || needs.mcp-tests.result != 'success' || needs.package-automation.result != 'success' || needs.renderer-contracts.result != 'success' }}
        run: |
          echo 'One or more mandatory CI boundaries failed, were cancelled, or were skipped.' >&2
          exit 1
      - name: Confirm complete CI coverage
        if: ${{ needs.preflight.result == 'success' && needs.static.result == 'success' && needs.workspace-tests.result == 'success' && needs.daemon-tests.result == 'success' && needs.mcp-tests.result == 'success' && needs.package-automation.result == 'success' && needs.renderer-contracts.result == 'success' }}
        run: echo 'Every mandatory CI boundary succeeded.'
