name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install native font dependencies
        run: sudo apt-get update && sudo apt-get install -y libfreetype6-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: python tools/foot-oracle/validate-fixtures.py
      - run: python -m pip install pytest
      - run: python -m pytest -q tools/foot-oracle/test_compare_glyph_masks.py tools/foot-oracle/test_compare_final_buffers.py tools/foot-oracle/test_run_final_buffer_comparison.py
