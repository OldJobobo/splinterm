name: Edge packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edge-packages
  cancel-in-progress: false

env:
  RELEASE_REPOSITORY: OldJobobo/splinterm

jobs:
  package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap Git for checkout
        run: pacman -Sy --noconfirm git

      - uses: actions/checkout@v4

      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            appstream desktop-file-utils fontconfig freetype2 git github-cli \
            hicolor-icon-theme libxkbcommon noto-fonts-cjk noto-fonts-emoji pixman pkgconf python \
            rust shellcheck ttf-jetbrains-mono-nerd wayland

      - name: Validate release tooling
        run: |
          shellcheck install.sh tools/package/build-local-package.sh tools/package/upgrade-local-package.sh
          python -m unittest tools/package/test_edge_manifest.py tools/package/test_edge_workflow.py

      - name: Build and validate split packages
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          # Full source tests remain in CI; edge publication performs a clean
          # release build plus extracted package/runtime validation.
          su builder -c "cd '$GITHUB_WORKSPACE' && tools/package/build-local-package.sh --no-check --skip-system-dependency-check"

      - name: Prepare commit-bound release assets
        run: |
          commit=${GITHUB_SHA,,}
          release_dir="$RUNNER_TEMP/splinterm-edge-release"
          mkdir -p "$release_dir"
          main_package=$(find packaging -maxdepth 1 -type f -name 'splinterm-[0-9]*.pkg.tar.zst' -print -quit)
          mcp_package=$(find packaging -maxdepth 1 -type f -name 'splinterm-mcp-[0-9]*.pkg.tar.zst' -print -quit)
          test -n "$main_package"
          test -n "$mcp_package"
          main_asset="$release_dir/splinterm-$commit-x86_64.pkg.tar.zst"
          mcp_asset="$release_dir/splinterm-mcp-$commit-x86_64.pkg.tar.zst"
          cp "$main_package" "$main_asset"
          cp "$mcp_package" "$mcp_asset"
          python tools/package/edge-manifest.py create \
            --repository "$RELEASE_REPOSITORY" \
            --commit "$commit" \
            --splinterm "$main_asset" \
            --splinterm-mcp "$mcp_asset" \
            --output "$release_dir/edge-manifest.json"
          python tools/package/edge-manifest.py verify \
            --repository "$RELEASE_REPOSITORY" \
            "$release_dir/edge-manifest.json" "$release_dir"
          printf 'RELEASE_DIR=%s\n' "$release_dir" >>"$GITHUB_ENV"
          printf 'RELEASE_TAG=edge-%s\n' "$commit" >>"$GITHUB_ENV"
          printf 'MAIN_ASSET=%s\n' "$main_asset" >>"$GITHUB_ENV"
          printf 'MCP_ASSET=%s\n' "$mcp_asset" >>"$GITHUB_ENV"

      - name: Publish the immutable commit release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Splinterm edge ${GITHUB_SHA:0:12}" \
              --notes 'CI-built x86_64 Arch/Omarchy packages for one exact Git commit.'
          fi
          gh release upload "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --clobber \
            "$MAIN_ASSET" "$MCP_ASSET" "$RELEASE_DIR/edge-manifest.json"

      - name: Advance the edge channel Git ref
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          manifest_blob=$(git hash-object -w "$RELEASE_DIR/edge-manifest.json")
          manifest_tree=$(printf '100644 blob %s\tedge-manifest.json\n' "$manifest_blob" | git mktree)
          channel_commit=$(printf 'Advance edge channel to %s\n' "$GITHUB_SHA" | git commit-tree "$manifest_tree")
          git push origin "$channel_commit:refs/heads/edge-channel" --force
